name: Diagnóstico de PC (ejecutable Windows)

on:
  push:
    paths:
      - "herramientas/diagnostico-pc/**"
      - ".github/workflows/diagnostico-pc.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: herramientas/diagnostico-pc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probar diagnóstico
        shell: pwsh
        run: |
          python diagnostico_pc.py --sin-abrir
          if ($LASTEXITCODE -gt 2) { exit $LASTEXITCODE }
          exit 0

      - name: Compilar ejecutable
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --onefile --console --name DiagnosticoPC diagnostico_pc.py

      - uses: actions/upload-artifact@v4
        with:
          name: DiagnosticoPC
          path: herramientas/diagnostico-pc/dist/DiagnosticoPC.exe
